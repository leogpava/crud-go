<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List — Go</title>
    <style>
        :root {
            --bg: #0b0e14;
            --surface: #11151c;
            --text: #c8d0da;
            --dim: #7a8696;
            --accent: #5ef2b8;
            --border: #1e2530;
            --radius: 6px;
            --mono: 'JetBrains Mono', 'Fira Code', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--mono);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 1rem;
        }

        .prompt {
            color: var(--dim);
            font-size: 0.8rem;
            margin-bottom: 2rem;
            letter-spacing: 0.05em;
        }

        .prompt span {
            color: var(--accent);
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .subtitle {
            color: var(--dim);
            font-size: 0.8rem;
            margin-bottom: 2.5rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
            width: 100%;
            max-width: 480px;
            margin-bottom: 1.5rem;
        }

        .input-row {
            display: flex;
            gap: 0.5rem;
        }

        input[type="text"] {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--mono);
            font-size: 0.9rem;
            padding: 0.65rem 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        button {
            background: transparent;
            border: 1px solid var(--accent);
            border-radius: var(--radius);
            color: var(--accent);
            font-family: var(--mono);
            font-size: 0.85rem;
            padding: 0.65rem 1rem;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        button:hover {
            background: var(--accent);
            color: var(--bg);
        }

        .list-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem 2rem;
            width: 100%;
            max-width: 480px;
        }

        .list-title {
            font-size: 0.75rem;
            color: var(--dim);
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }

        #lista {
            list-style: none;
        }

        #lista li {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.875rem;
        }

        #lista li:last-child {
            border-bottom: none;
        }

        #lista li.feita .texto-tarefa {
            text-decoration: line-through;
            color: var(--dim);
        }

        .texto-tarefa {
            flex: 1;
            cursor: pointer;
        }

        .btn-check {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--accent);
            width: 24px;
            height: 24px;
            font-size: 0.8rem;
            padding: 0;
            cursor: pointer;
            flex-shrink: 0;
        }

        .btn-check:hover {
            border-color: var(--accent);
            background: transparent;
        }

        .btn-delete {
            background: transparent;
            border: none;
            color: var(--dim);
            font-size: 1rem;
            padding: 0 0.3rem;
            cursor: pointer;
            flex-shrink: 0;
        }

        .btn-delete:hover {
            background: transparent;
            color: #f87171;
        }

        .empty {
            color: var(--dim);
            font-size: 0.8rem;
        }

        .msg {
            font-size: 0.75rem;
            margin-top: 0.75rem;
            min-height: 1.2em;
            color: var(--accent);
        }

        .msg.erro {
            color: #f87171;
        }
    </style>
</head>

<body>

    <p class="prompt"><span>leogpava</span>:~$ ./todo --run</p>

    <h1>To-Do List</h1>
    <p class="subtitle">// Go backend — CRUD</p>

    <div class="card">
        <div class="input-row">
            <input type="text" id="nova-tarefa" placeholder="Nova tarefa..." autocomplete="off" />
            <button id="btn-adicionar">[ adicionar ]</button>
        </div>
        <p class="msg" id="msg"></p>
    </div>

    <div class="list-card">
        <p class="list-title">// tarefas</p>
        <ul id="lista">
            <li class="empty">nenhuma tarefa ainda.</li>
        </ul>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080';

        const input = document.getElementById('nova-tarefa');
        const btnAdd = document.getElementById('btn-adicionar');
        const lista = document.getElementById('lista');
        const msg = document.getElementById('msg');

        function mostrarMsg(texto, erro = false) {
            msg.textContent = texto;
            msg.className = erro ? 'msg erro' : 'msg';
            setTimeout(() => { msg.textContent = ''; }, 2000);
        }

        // --- READ: carrega as tarefas ao abrir a página ---
        async function carregarTarefas() {
            try {
                const res = await fetch(`${API_BASE}/tarefas`);
                const tarefas = await res.json();
                renderLista(tarefas);
            } catch {
                mostrarMsg('Erro ao carregar tarefas. O servidor está rodando?', true);
            }
        }

        function renderLista(tarefas) {
            if (!tarefas || !tarefas.length) {
                lista.innerHTML = '<li class="empty">nenhuma tarefa ainda.</li>';
                return;
            }
            lista.innerHTML = tarefas.map(t => `
        <li class="${t.feita ? 'feita' : ''}" data-id="${t.id}">
          <button class="btn-check" data-action="toggle" data-id="${t.id}" data-feita="${t.feita}">
            ${t.feita ? '✓' : ''}
          </button>
          <span class="texto-tarefa">${t.texto}</span>
          <button class="btn-delete" data-action="delete" data-id="${t.id}">✕</button>
        </li>
      `).join('');
        }

        // --- CREATE: adiciona nova tarefa ---
        async function adicionarTarefa() {
            const texto = input.value.trim();
            if (!texto) {
                mostrarMsg('Digite uma tarefa antes de adicionar.', true);
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/tarefas`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ texto }),
                });
                if (!res.ok) throw new Error();

                input.value = '';
                mostrarMsg('Tarefa adicionada!');
                carregarTarefas();
            } catch {
                mostrarMsg('Erro ao adicionar tarefa.', true);
            }
        }

        // --- UPDATE: marca como feita/não feita ---
        async function alternarTarefa(id, feitaAtual) {
            try {
                const res = await fetch(`${API_BASE}/tarefas/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ feita: !feitaAtual }),
                });
                if (!res.ok) throw new Error();
                carregarTarefas();
            } catch {
                mostrarMsg('Erro ao atualizar tarefa.', true);
            }
        }

        // --- DELETE: remove a tarefa ---
        async function deletarTarefa(id) {
            try {
                const res = await fetch(`${API_BASE}/tarefas/${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error();
                mostrarMsg('Tarefa removida.');
                carregarTarefas();
            } catch {
                mostrarMsg('Erro ao remover tarefa.', true);
            }
        }

        btnAdd.addEventListener('click', adicionarTarefa);
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter') adicionarTarefa();
        });

        lista.addEventListener('click', e => {
            const btn = e.target.closest('button');
            if (!btn) return;

            const id = btn.dataset.id;
            const action = btn.dataset.action;

            if (action === 'toggle') {
                alternarTarefa(id, btn.dataset.feita === 'true');
            } else if (action === 'delete') {
                deletarTarefa(id);
            }
        });

        carregarTarefas();
    </script>

</body>

</html>
