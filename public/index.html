<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operacoes Financeiras — Go</title>
    <style>
        :root {
            --bg: #0b0e14;
            --surface: #11151c;
            --text: #c8d0da;
            --dim: #7a8696;
            --accent: #5ef2b8;
            --border: #1e2530;
            --radius: 6px;
            --mono: 'JetBrains Mono', 'Fira Code', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--mono);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 1rem;
        }

        .prompt {
            color: var(--dim);
            font-size: 0.8rem;
            margin-bottom: 2rem;
            letter-spacing: 0.05em;
        }

        .prompt span {
            color: var(--accent);
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .subtitle {
            color: var(--dim);
            font-size: 0.8rem;
            margin-bottom: 2.5rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
            width: 100%;
            max-width: 700px;
            margin-bottom: 1.5rem;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        select {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--mono);
            font-size: 0.9rem;
            padding: 0.65rem 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="date"]:focus,
        select:focus {
            border-color: var(--accent);
        }

        .actions {
            margin-top: 0.75rem;
            display: flex;
            justify-content: flex-end;
        }

        button {
            background: transparent;
            border: 1px solid var(--accent);
            border-radius: var(--radius);
            color: var(--accent);
            font-family: var(--mono);
            font-size: 0.85rem;
            padding: 0.65rem 1rem;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        button:hover {
            background: var(--accent);
            color: var(--bg);
        }

        .list-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem 2rem;
            width: 100%;
            max-width: 700px;
        }

        .list-title {
            font-size: 0.75rem;
            color: var(--dim);
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }

        .op-list {
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
        }

        .op-item {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.8rem;
            background: rgba(0, 0, 0, 0.16);
        }

        .op-head {
            display: flex;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
        }

        .tag {
            color: var(--accent);
        }

        .op-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.35rem 0.75rem;
            font-size: 0.82rem;
            color: var(--dim);
        }

        .op-grid strong {
            color: var(--text);
        }

        #lista {
            list-style: none;
        }

        .empty {
            color: var(--dim);
            font-size: 0.8rem;
        }

        .msg {
            font-size: 0.75rem;
            margin-top: 0.75rem;
            min-height: 1.2em;
            color: var(--accent);
        }

        .msg.erro {
            color: #f87171;
        }

        @media (max-width: 720px) {
            .input-row,
            .op-grid {
                grid-template-columns: 1fr;
            }

            .op-head {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <p class="prompt"><span>leogpava</span>:~$ ./finops --run</p>

    <h1>Operacoes de Financiamento</h1>
    <p class="subtitle">// Go backend — create + list</p>

    <div class="card">
        <div class="input-row">
            <input type="text" id="operacaoID" placeholder="operacaoID (ex: OP-0001)" autocomplete="off" />
            <input type="number" id="valorFinanciado" placeholder="valorFinanciado" step="0.01" min="0" />
            <input type="number" id="quantidadeParcelas" placeholder="quantidadeParcelas" step="1" min="1" />
            <input type="number" id="taxaJuros" placeholder="taxaJuros" step="0.0001" min="0" />
            <input type="date" id="primeiroVencimento" />
            <select id="sistemaAmortizacao">
                <option value="PRICE">PRICE</option>
                <option value="SAC">SAC</option>
            </select>
        </div>
        <div class="actions">
            <button id="btn-adicionar">[ criar operacao ]</button>
        </div>
        <p class="msg" id="msg"></p>
    </div>

    <div class="list-card">
        <p class="list-title">// operacoes cadastradas</p>
        <ul id="lista">
            <li class="empty">nenhuma operacao ainda.</li>
        </ul>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080';

        const inputOperacaoID = document.getElementById('operacaoID');
        const inputValorFinanciado = document.getElementById('valorFinanciado');
        const inputQuantidadeParcelas = document.getElementById('quantidadeParcelas');
        const inputTaxaJuros = document.getElementById('taxaJuros');
        const inputPrimeiroVencimento = document.getElementById('primeiroVencimento');
        const inputSistemaAmortizacao = document.getElementById('sistemaAmortizacao');
        const btnAdd = document.getElementById('btn-adicionar');
        const lista = document.getElementById('lista');
        const msg = document.getElementById('msg');

        function mostrarMsg(texto, erro = false) {
            msg.textContent = texto;
            msg.className = erro ? 'msg erro' : 'msg';
            setTimeout(() => { msg.textContent = ''; }, 2000);
        }

        function moedaBRL(valor) {
            return Number(valor).toLocaleString('pt-BR', {
                style: 'currency',
                currency: 'BRL',
            });
        }

        async function carregarOperacoes() {
            try {
                const res = await fetch(`${API_BASE}/operacoes`);
                const operacoes = await res.json();
                renderLista(operacoes);
            } catch {
                mostrarMsg('Erro ao carregar operacoes. O servidor esta rodando?', true);
            }
        }

        function renderLista(operacoes) {
            if (!operacoes || !operacoes.length) {
                lista.innerHTML = '<li class="empty">Nenhuma operação ainda.</li>';
                return;
            }

            lista.innerHTML = operacoes.map(op => `
                <li class="op-item">
                    <div class="op-head">
                        <span><strong>${op.operacaoID}</strong></span>
                        <span class="tag">${op.sistemaAmortizacao}</span>
                    </div>
                    <div class="op-grid">
                        <span><strong>id:</strong> ${op.id}</span>
                        <span><strong>valor:</strong> ${moedaBRL(op.valorFinanciado)}</span>
                        <span><strong>parcelas:</strong> ${op.quantidadeParcelas}</span>
                        <span><strong>taxa:</strong> ${op.taxaJuros}%</span>
                        <span><strong>1o vencimento:</strong> ${op.primeiroVencimento}</span>
                    </div>
                </li>
            `).join('');
        }

        async function criarOperacao() {
            const payload = {
                operacaoID: inputOperacaoID.value.trim(),
                valorFinanciado: Number(inputValorFinanciado.value),
                quantidadeParcelas: Number(inputQuantidadeParcelas.value),
                taxaJuros: Number(inputTaxaJuros.value),
                primeiroVencimento: inputPrimeiroVencimento.value,
                sistemaAmortizacao: inputSistemaAmortizacao.value,
            };

            if (!payload.operacaoID || !payload.primeiroVencimento || !payload.sistemaAmortizacao) {
                mostrarMsg('Preencha os campos obrigatorios.', true);
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/operacoes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });

                if (!res.ok) {
                    const body = await res.json().catch(() => ({}));
                    throw new Error(body.erro || 'erro ao criar operacao');
                }

                inputOperacaoID.value = '';
                inputValorFinanciado.value = '';
                inputQuantidadeParcelas.value = '';
                inputTaxaJuros.value = '';
                inputPrimeiroVencimento.value = '';
                inputSistemaAmortizacao.value = 'PRICE';

                mostrarMsg('Operacao criada com sucesso.');
                carregarOperacoes();
            } catch (err) {
                mostrarMsg(err.message || 'Erro ao criar operacao.', true);
            }
        }

        btnAdd.addEventListener('click', criarOperacao);

        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                const active = document.activeElement;
                if (active && (active.tagName === 'INPUT' || active.tagName === 'SELECT')) {
                    criarOperacao();
                }
            }
        });

        carregarOperacoes();
    </script>

</body>

</html>
